<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build Sprint</title>
<style>
  :root { color-scheme: light dark; --rule:#8884; }
  body { font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 2.5rem 1.25rem; max-width: 46rem; margin-inline: auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { opacity: .65; margin: 0 0 2rem; }
  .row { border: 1px solid var(--rule); border-radius: 10px; padding: 1rem 1.15rem; margin: .6rem 0; }
  .muted { opacity: .65; font-size: .9rem; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: .85em; }
  #status { font-size: .85rem; padding: .5rem .75rem; border: 1px solid var(--rule); border-radius: 8px; display: inline-block; }
</style>

<h1>Your one screen</h1>
<p class="sub">It answers one question. Everything else is a dashboard.</p>

<p id="status" class="muted">checking…</p>

<div id="findings"></div>

<script type="module">
  // Escape on render. Your fixture is text written by strangers, and this is
  // the other half of prompt-injection defence.
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  const health = await fetch('/api/health').then((r) => r.json());
  document.getElementById('status').textContent =
    `model ${health.model} · ai ${health.aiMode} · key ${health.hasApiKey ? 'set' : 'not set'}`;

  const data = await fetch('/api/findings').then((r) => r.json());
  const el = document.getElementById('findings');

  if (!data.findings.length) {
    el.innerHTML = `<div class="row muted">No findings yet. Stage 3 is where these come from:
      <code>src/stages/3-detect/index.ts</code></div>`;
  } else {
    el.innerHTML = data.findings
      .map((f) => `<div class="row"><strong>${esc(f.title)}</strong>
        <div class="muted">${f.coveredIds.length} records · score ${esc(f.score)}</div></div>`)
      .join('');
  }
</script>
