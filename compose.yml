# One command brings up everything: `docker compose up -d db`
# You do not install Postgres by hand. That is the point.
#
# The `app` service exists for VS Code's devcontainer. If you are running
# node on your own machine (the normal path), you only need `db`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sprint
      POSTGRES_PASSWORD: sprint
      POSTGRES_DB: sprint
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprint"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    command: sleep infinity
    volumes:
      - .:/workspace:cached
    environment:
      DATABASE_URL: postgres://sprint:sprint@db:5432/sprint
    depends_on:
      db:
        condition: service_healthy
    profiles: ["devcontainer"]

volumes:
  dbdata:
